[project]
name = "revit-mcp"
version = "1.0.0"
description = "MCP-сервер для Revit: облако точек, построение модели и выпуск чертежей по шаблону"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
revit-mcp = "revit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
